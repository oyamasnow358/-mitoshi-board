<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>みとおし ボード｜MieeL</title>
<style>
  /* ============================================================
     みとおし ボード（いつ おわる？ つぎは なに？）  見た目（CSS）
     ============================================================ */
  :root {
    --mieel: radial-gradient(circle at 50% 0%,#1B8FE8 0%,#2BB8D6 28%,#3FCB9E 45%,#8FD24A 58%,#F4D027 72%,#F7941E 100%);
    --bg: #F2F7F5; --ink: #1F2937; --sub: #6B7280; --line: #D5E3DD;
    --go: #2F9E44; --go-d: #237A34; --blue: #1C7ED6; --blue-d: #1864AB; --orange: #F76707; --gold: #FAB005; --red: #E03131; --teal: #0CA678;
    --brk: #20C997; --fun: #F06595;
    --emo: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    font-weight: 700; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; overscroll-behavior: none;
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  .emo { font-family: var(--emo); font-weight: 400; line-height: 1; }

  .topbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; min-height: 64px; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 4px 14px 4px 8px; border-radius: 999px; background: #fff; border: 3px solid var(--line); font-size: 19px; white-space: nowrap; touch-action: none; }
  .chip .emo { font-size: 26px; }
  .chip.home { border-color: #96F2D7; background: #E6FCF5; color: #087F5B; position: relative; overflow: hidden; }
  .chip.home i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(12, 166, 120, .25); }
  .chip.home.pressing i { width: 100%; transition: width 1.2s linear; }
  .chip.home span { position: relative; }
  .brand { flex: 1; display: flex; justify-content: center; align-items: center; gap: 14px; color: #6FA08E; font-size: 16px; letter-spacing: .1em; min-width: 0; }
  .mieel-brand { display: flex; align-items: center; gap: 7px; white-space: nowrap; flex: none; }
  .orb-mini { width: 22px; height: 22px; border-radius: 50%; background: var(--mieel); flex: none; }
  .mieel-brand strong { font-size: 16px; color: var(--ink); }
  .mieel-brand .url { font-size: 12px; color: var(--sub); font-weight: 600; }
  .mieel-foot { margin-top: 28px; padding-top: 16px; border-top: 1px solid #E9ECEF; text-align: center; color: var(--sub); font-size: 13px; line-height: 1.8; }
  .mieel-foot .mieel-brand { justify-content: center; }
  .mieel-foot a { color: #1C7ED6; font-weight: 700; text-decoration: none; font-size: 14px; }
  .gear { position: relative; width: 52px; height: 52px; border-radius: 50%; border: none; background: transparent; opacity: .35; font-size: 26px; display: grid; place-items: center; }
  .gear::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; border: 4px solid transparent; }
  .gear.pressing { opacity: 1; }
  .gear.pressing::after { border-color: var(--blue); animation: ring 1.5s linear forwards; }
  @keyframes ring { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 0 16px 12px; }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; gap: clamp(8px, 1.4vh, 14px); animation: fadein .25s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pulse { to { transform: scale(1.05); } }
  @keyframes blink { 50% { opacity: .35; } }
  .title { font-size: clamp(24px, 3.4vw, 42px); text-align: center; margin: 0; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
  .title small { display: block; font-size: .5em; color: var(--sub); }
  .actions { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .big-btn { min-width: min(280px, 78vw); min-height: 78px; padding: 0 28px; border: none; border-radius: 999px; color: #fff; font-size: clamp(21px, 3vw, 34px); display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
  .big-btn.go { background: var(--go); box-shadow: 0 8px 0 var(--go-d); }
  .big-btn.blue { background: var(--blue); box-shadow: 0 8px 0 var(--blue-d); }
  .big-btn.white { background: #fff; color: var(--ink); box-shadow: 0 8px 0 var(--line); border: 4px solid var(--line); }
  .big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .mid-btn { min-height: 54px; padding: 0 18px; border-radius: 999px; border: 4px solid var(--line); background: #fff; font-size: clamp(15px, 1.9vw, 20px); box-shadow: 0 5px 0 var(--line); display: inline-flex; align-items: center; gap: 8px; }
  .mid-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  .mid-btn.warn { border-color: #FFC9C9; color: #C92A2A; box-shadow: 0 5px 0 #FFC9C9; }

  /* カード（しゃしん・えもじ） */
  .pic { position: relative; display: grid; place-items: center; overflow: hidden; background: #fff; }
  .pic img { width: 100%; height: 100%; object-fit: cover; }
  .pic .emo { font-size: var(--es, 60px); }

  /* ホーム */
  .home { align-items: center; }
  .home > :first-child { margin-top: auto; } .home > :last-child { margin-bottom: auto; }
  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 44vw), 1fr)); gap: 14px; width: min(980px, 100%); }
  .mcard { background: #fff; border: 6px solid var(--c); border-radius: 30px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; box-shadow: 0 7px 0 var(--c); touch-action: none; position: relative; overflow: hidden; }
  .mcard .emo { font-size: clamp(50px, 8vh, 80px); }
  .mcard b { font-size: clamp(20px, 2.6vw, 30px); color: var(--c); }
  .mcard small { font-size: clamp(13px, 1.6vw, 17px); color: var(--sub); }
  .mcard:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--c); }
  .mcard .lp { position: absolute; left: 0; bottom: 0; height: 8px; width: 0; background: var(--c); }
  .mcard.pressing .lp { width: 100%; transition: width 1.2s linear; }
  .privacy { font-size: 14px; color: var(--sub); text-align: center; background: #fff; border-radius: 14px; padding: 8px 14px; border: 2px dashed var(--line); }

  /* ---------- こども：いま と つぎ ---------- */
  .now { gap: 10px; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 6px 4px 8px; flex: none; scroll-behavior: smooth; }
  .scard { flex: none; width: clamp(70px, 9vw, 104px); border-radius: 16px; background: #fff; border: 4px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 4px 6px; position: relative; font-size: clamp(11px, 1.3vw, 14px); text-align: center; line-height: 1.25; }
  .scard .pic { width: 100%; aspect-ratio: 1; border-radius: 10px; --es: clamp(30px, 4.6vw, 52px); }
  .scard.done { opacity: .4; filter: grayscale(.7); }
  .scard.done::after { content: "✓"; position: absolute; right: 4px; top: 2px; background: var(--go); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; font-size: 15px; }
  .scard.cur { border-color: var(--blue); box-shadow: 0 0 0 4px #A5D8FF; transform: scale(1.06); }
  .scard.brk { border-color: var(--brk); } .scard.fun { border-color: var(--fun); }
  .scard.chg::before { content: "かわった"; position: absolute; left: 50%; top: -10px; transform: translateX(-50%); background: var(--orange); color: #fff; font-size: 11px; border-radius: 999px; padding: 0 6px; white-space: nowrap; z-index: 1; }
  .nowmain { flex: 1; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .85fr); gap: clamp(12px, 2.4vw, 28px); min-height: 0; align-items: stretch; }
  .curbox { background: #fff; border-radius: 34px; border: 6px solid var(--blue); padding: clamp(10px, 1.6vw, 18px); display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 0; }
  .curbox.brk { border-color: var(--brk); } .curbox.fun { border-color: var(--fun); }
  .curbox .lab { font-size: clamp(18px, 2.2vw, 26px); color: var(--blue); }
  .curbox .row { flex: 1; display: flex; align-items: center; justify-content: center; gap: clamp(12px, 2vw, 26px); width: 100%; min-height: 0; }
  .curbox .pic { width: min(100%, 36vh); aspect-ratio: 1; border-radius: 26px; --es: clamp(90px, 18vh, 170px); flex: none; }
  .curbox .nm { font-size: clamp(28px, 4.4vw, 54px); text-align: center; line-height: 1.25; word-break: keep-all; }
  .tbox { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .left { font-size: clamp(24px, 3.6vw, 44px); text-align: center; white-space: nowrap; }
  .left b { font-size: 1.35em; }
  .endat { font-size: clamp(14px, 1.7vw, 19px); color: var(--sub); }
  .pie { width: clamp(130px, 22vh, 220px); aspect-ratio: 1; }
  .barv { width: min(100%, 520px); height: clamp(36px, 6vh, 60px); border-radius: 999px; background: #E9ECEF; overflow: hidden; border: 4px solid #DEE2E6; }
  .barv i { display: block; height: 100%; border-radius: 999px; transition: width .3s linear, background-color .6s; }
  .blocks { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 520px; }
  .blocks i { width: clamp(30px, 4.6vh, 46px); aspect-ratio: 1; border-radius: 10px; background: var(--bc); transition: opacity .4s, transform .4s; }
  .blocks i.gone { opacity: .12; transform: scale(.7); }
  .tokens { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .tokens button { width: clamp(60px, 9vh, 90px); aspect-ratio: 1; border-radius: 50%; border: 5px solid #FFD43B; background: #FFF9DB; font-size: clamp(26px, 4vh, 40px); }
  .tokens button.used { background: #E9ECEF; border-color: #CED4DA; color: transparent; position: relative; }
  .tokens button.used::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--go); font-size: 1.4em; }
  .tokens button.next { animation: pulse .8s ease-in-out infinite alternate; }
  .lastone { white-space: nowrap; font-size: clamp(24px, 3.6vw, 44px); color: var(--orange); animation: pulse .7s ease-in-out infinite alternate; }
  .nextbox { background: #fff; border-radius: 30px; border: 5px dashed #ADB5BD; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 0; }
  .nextbox .lab { font-size: clamp(18px, 2.2vw, 26px); color: var(--sub); }
  .nextbox .pic { width: min(100%, 22vh); aspect-ratio: 1; border-radius: 22px; --es: clamp(60px, 12vh, 110px); }
  .nextbox .nm { font-size: clamp(22px, 3vw, 36px); text-align: center; }
  .thenmsg { font-size: clamp(18px, 2.4vw, 28px); text-align: center; background: #E6FCF5; color: #087F5B; border-radius: 16px; padding: 6px 12px; }
  .thenmsg.brk { background: #E6FCF5; } .thenmsg.fun { background: #FFF0F6; color: #C2255C; }
  .tools { display: flex; gap: 8px; }
  .strip .scard { cursor: pointer; font: inherit; font-size: clamp(11px, 1.3vw, 14px); color: inherit; }
  .nowfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .donebtn { flex: 1; min-width: min(320px, 70vw); max-width: 520px; min-height: 84px; border-radius: 999px; border: none; background: var(--go); color: #fff; font-size: clamp(24px, 3.4vw, 38px); box-shadow: 0 8px 0 var(--go-d); }
  .donebtn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--go-d); }
  .tool { width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--line); background: #fff; font-size: 24px; }
  .warnbar { text-align: center; font-size: clamp(20px, 2.8vw, 32px); color: #fff; background: var(--orange); border-radius: 16px; padding: 6px; animation: blink 1s ease-in-out infinite; }
  /* おしらせ（かわった・つぎは・ことば） */
  .ov { position: fixed; inset: 0; z-index: 45; background: rgba(242, 247, 245, .97); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; animation: fadein .25s; text-align: center; overflow-y: auto; }
  .ov h1 { margin: 0; font-size: clamp(28px, 4.6vw, 56px); }
  .ov .sub { font-size: clamp(18px, 2.4vw, 28px); color: var(--sub); }
  .tr { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 3vw, 40px); flex-wrap: wrap; }
  .tr .card { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tr .pic { width: clamp(150px, 26vh, 260px); aspect-ratio: 1; border-radius: 28px; border: 6px solid var(--line); --es: clamp(90px, 16vh, 160px); }
  .tr .card b { font-size: clamp(22px, 3vw, 36px); }
  .tr .arrow { font-size: clamp(50px, 9vh, 90px); color: var(--blue); }
  .tr .old .pic { filter: grayscale(1); opacity: .5; border-color: #FFA8A8; }
  .tr .old .pic::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--red); font-size: 120px; font-weight: 900; }
  .tr .new .pic { border-color: var(--go); box-shadow: 0 0 0 6px #B2F2BB; }
  .cmp { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: start; width: min(1000px, 100%); }
  .cmp .col { background: #fff; border-radius: 22px; padding: 10px; border: 4px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .cmp .col h3 { margin: 0; font-size: 20px; color: var(--sub); }
  .cmp .it { display: flex; align-items: center; gap: 8px; font-size: clamp(15px, 2vw, 20px); border-radius: 12px; padding: 4px 8px; border: 3px solid transparent; text-align: left; }
  .cmp .it .pic { width: 46px; height: 46px; border-radius: 10px; --es: 32px; flex: none; }
  .cmp .it.rm { background: #FFF5F5; border-color: #FFA8A8; text-decoration: line-through; color: #C92A2A; }
  .cmp .it.add { background: #EBFBEE; border-color: #8CE99A; }
  .cmp .it.mv { background: #FFF4E6; border-color: #FFC078; }
  .cmp .it small { margin-left: auto; font-size: 12px; white-space: nowrap; }
  .cmp .mid { font-size: 44px; color: var(--blue); align-self: center; }
  .banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 46; background: #fff; border: 8px solid var(--orange); border-radius: 36px; padding: 24px 40px; font-size: clamp(36px, 7vw, 86px); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.2); animation: pop .3s cubic-bezier(.2, 1.4, .4, 1); max-width: 92vw; }
  .phr { position: fixed; right: 14px; bottom: 90px; z-index: 44; background: #fff; border-radius: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.2); padding: 10px; display: grid; gap: 6px; max-height: 70vh; overflow-y: auto; }
  .phr button { border: 3px solid var(--line); background: #fff; border-radius: 14px; padding: 8px 14px; font-size: 18px; text-align: left; }
  .alldone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }

  /* まず → つぎ */
  .ft { flex: 1; display: grid; grid-template-columns: 1fr auto 1fr; gap: clamp(10px, 2vw, 24px); align-items: center; min-height: 0; }
  .ftbox { background: #fff; border-radius: 34px; border: 6px solid var(--c); padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; height: 100%; justify-content: center; }
  .ftbox h2 { margin: 0; font-size: clamp(26px, 4vw, 48px); color: var(--c); }
  .ftbox .pic { width: min(100%, 34vh); aspect-ratio: 1; border-radius: 26px; --es: clamp(90px, 16vh, 160px); border: 4px dashed var(--line); }
  .ftbox .nm { font-size: clamp(22px, 3.4vw, 40px); }
  .ftbox.dim { opacity: .45; }
  .ftt .pie { width: clamp(90px, 14vh, 150px); } .ftt .left { font-size: clamp(20px, 2.8vw, 32px); }
  .ft .arrow { font-size: clamp(50px, 9vh, 96px); color: var(--sub); }

  /* ---------- 先生：よていを つくる ---------- */
  .plans { display: flex; flex-direction: column; gap: 10px; }
  .pl { display: flex; align-items: center; gap: 10px; background: #fff; border: 4px solid var(--line); border-radius: 20px; padding: 10px 12px; flex-wrap: wrap; }
  .pl .nm { flex: 1; min-width: 160px; font-size: clamp(17px, 2vw, 22px); }
  .pl .nm small { display: block; color: var(--sub); font-size: 13px; }
  .pl .thumbs { display: flex; gap: 3px; }
  .pl .thumbs .pic { width: 34px; height: 34px; border-radius: 8px; --es: 24px; border: 1px solid var(--line); }
  .pl.today { border-color: var(--blue); }
  .ed { gap: 10px; }
  .edhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .edhead input { flex: 1; min-width: 200px; font: inherit; font-size: 22px; padding: 8px 12px; border-radius: 14px; border: 3px solid var(--line); }
  .items { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: center; gap: 8px; background: #fff; border: 4px solid var(--line); border-radius: 20px; padding: 8px 10px; flex-wrap: wrap; }
  .item.brk { border-color: #96F2D7; } .item.fun { border-color: #FCC2D7; }
  .item.past { opacity: .5; }
  .item .no { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 15px; flex: none; }
  .item .pic { width: 70px; height: 70px; border-radius: 14px; --es: 46px; border: 2px solid var(--line); flex: none; cursor: pointer; }
  .item input.n { flex: 1; min-width: 140px; font: inherit; font-size: 20px; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); }
  .stp { display: flex; align-items: center; gap: 4px; font-size: 15px; }
  .stp button { width: 36px; height: 36px; border-radius: 10px; border: 2px solid var(--line); background: #fff; font-size: 18px; }
  .stp b { min-width: 64px; text-align: center; }
  .sm-seg { display: flex; gap: 4px; }
  .sm-seg button { border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 6px 8px; font-size: 14px; }
  .sm-seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .ibtn { width: 40px; height: 40px; border-radius: 10px; border: none; background: #F1F3F5; font-size: 17px; }
  .ibtn.warn { background: #FFF0F0; color: #C92A2A; }
  .lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .lib button { background: #fff; border: 3px solid var(--line); border-radius: 16px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 14px; }
  .lib button .emo { font-size: 40px; }
  .lib h4 { grid-column: 1 / -1; margin: 6px 0 0; color: var(--sub); }

  body.calm *, body.calm *::before, body.calm *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
  @media (orientation: portrait) {
    .nowmain { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    .nextbox { flex-direction: row; justify-content: center; flex-wrap: wrap; }
    .nextbox .pic { width: 16vh; }
    .curbox .row { flex-direction: column; }
    .ft { grid-template-columns: 1fr; grid-template-rows: 1fr auto 1fr; }
    .ft .arrow { transform: rotate(90deg); }
    .cmp { grid-template-columns: 1fr; } .cmp .mid { transform: rotate(90deg); }
  }
  @media (max-width: 600px), (max-height: 520px) {
    .topbar { min-height: 50px; padding: 4px 8px; gap: 6px; }
    .topbar .appname, .topbar .url, .chip .lbl { display: none; }
    .chip { font-size: 15px; padding: 2px 8px 2px 6px; border-width: 2px; } .chip .emo { font-size: 20px; }
    .gear { width: 42px; height: 42px; font-size: 21px; }
    main { padding: 0 8px 8px; }

     ============================================================ */
  function openSettings() { stopSpeak(); renderSettings(); $('#settings').classList.add('open'); $('#settings').scrollTop = 0; }
  function closeSettings() { persist(); $('#settings').classList.remove('open'); document.body.classList.toggle('calm', !!S().calm); if (screen === 'home') renderHome(); else if (screen === 'teacher') renderTeacher(); else if (screen === 'who') renderWho(); else if (screen === 'now' && !document.querySelector('.ov')) renderNow(); chips(); }
  function refresh() { const m = $('#settings'), y = m.scrollTop; renderSettings(); m.scrollTop = y; }
  const setS = (k, v) => { S()[k] = v; persist(); refresh(); };
  function seg(value, opts, onPick) { return h('div', { class: 'seg' }, opts.map(o => h('button', { type: 'button', class: String(o[0]) === String(value) ? 'on' : '', onclick: () => onPick(o[0]) }, o[1]))); }
  const srow = (label, ctl, note) => h('div', { class: 'srow' }, h('div', null, label, note ? h('div', { class: 'note' }, note) : null), ctl);
  const chk = (label, k, note) => h('label', { class: 'row' }, h('span', null, label, note ? h('div', { class: 'note' }, note) : null), h('input', { type: 'checkbox', checked: !!S()[k], onchange: e => { S()[k] = e.target.checked; persist(); } }));
  function renderSettings() {
    const P = $('#settingsPanel'); P.innerHTML = '';
    const add = (...a) => P.append(...a.filter(Boolean));
    const st = S();
    add(h('div', { class: 'panel-head' }, h('h2', null, '⚙️ 先生用せってい'), h('button', { type: 'button', class: 'btn ok', onclick: closeSettings }, '✓ とじる')),
      h('p', { class: 'note' }, 'この画面は 右上の ⚙️ を 1.5秒 ながおし すると ひらきます。よていの へんしゅうは ホームの「よていを つくる・かえる」（1びょう ながおし）から。'));
    add(h('h3', null, '👦 こども'));
    store.kids.forEach((k, i) => add(h('div', { class: 'prow' },
      h('button', { type: 'button', class: 'mini-btn', onclick: () => { k.icon = ICONS[(ICONS.indexOf(k.icon) + 1) % ICONS.length]; persist(); refresh(); } }, E(k.icon)),
      h('input', { type: 'text', value: k.name, style: 'flex:1;min-width:140px', oninput: e => { k.name = e.target.value; persistSoon(); } }),
      h('span', { class: 'note' }, '📋 ' + k.plans.length + 'こ'),
      store.kids.length > 1 ? h('button', { type: 'button', class: 'mini-btn warn', onclick: () => { if (confirm(k.name + ' を けしますか？（よていと しゃしんも きえます）')) { store.kids.splice(i, 1); if (store.currentId === k.id) store.currentId = store.kids[0].id; persist(); cleanMedia(); refresh(); } } }, 'けす') : null)));
    add(h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn primary', onclick: () => { store.kids.push(newKid('なまえ' + (store.kids.length + 1), ICONS[store.kids.length % ICONS.length])); persist(); refresh(); } }, '＋ こどもを ふやす')),
      h('p', { class: 'note' }, '2人いじょう いると、はじめに「だれの よてい？」が でます。'));
    add(h('h3', null, '⏱️ のこりじかんの みせかた'),
      srow('タイマー', seg(st.timer, [['pie', '🕒 えんが へる'], ['bar', '▬ バーが へる'], ['blocks', '🟩 ブロックが きえる']], v => setS('timer', v)), 'どれも のこりが すくなく なると みどり → きいろ → あか に かわります。'),
      srow('もうすぐ おしまいの しらせ', seg(st.warn, [[0, 'なし'], [1, '1ぷん まえ'], [2, '2ふん まえ'], [5, '5ふん まえ']], v => setS('warn', Number(v)))),
      chk('おわる じこく（🕒 10:30 に おわり）を みせる', 'endTime'),
      chk('じかんに なったら じどうで つぎへ すすむ', 'autoNext', 'オフ：「おしまいの じかん」の がめんで「おわった」を おしてから つぎへ（おすすめ）'),
      chk('よていを かえたら、こどもの がめんで「まえ → あと」を しらせる', 'notify'));
    add(h('h3', null, '💬 ことばカード（いまの がめんの 💬）'),
      h('p', { class: 'note' }, '1ぎょうに 1つ。「あと 1かい」「おわったら きゅうけい」など、よく つかう ことばを おおきく みせて よみあげます。'),
      h('textarea', { oninput: e => { st.phrases = e.target.value; persistSoon(); } }, st.phrases),
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn', onclick: () => setS('phrases', DEFAULT_PHRASES.join('\n')) }, 'はじめの ことばに もどす')));
    add(h('h3', null, '🔊 おと・ひょうじ'), chk('よみあげ', 'voice'), chk('こうかおん', 'sound'),
      srow('おおきさ', h('input', { type: 'range', min: '0.2', max: '1', step: '0.1', value: st.volume, onchange: e => { st.volume = Number(e.target.value); persist(); } })),
      srow('よみあげの はやさ', seg(st.rate, [[0.8, 'ゆっくり'], [0.95, 'ふつう'], [1.1, 'はやめ']], v => setS('rate', Number(v)))),
      chk('うごきを ひかえめに', 'calm'));
    add(h('h3', null, '🔒 データ（この たんまつの なかだけ）'),
      h('p', { class: 'note' }, 'しゃしんと よていは この iPad（ブラウザ）の なかだけに ほぞん され、インターネットには おくりません。ほかの たんまつに うつす ときや、まんいちに そなえる ときは「ファイルに かきだす」で ほぞん して ください（しゃしんも はいります）。ブラウザの「きろくを けす」を すると きえます。'),
      h('div', { class: 'btns' },
        h('button', { type: 'button', class: 'btn primary', onclick: exportData }, '⬇ ファイルに かきだす'),
        h('button', { type: 'button', class: 'btn', onclick: importData }, '⬆ ファイルから よみこむ'),
        h('button', { type: 'button', class: 'btn warn', onclick: async () => { if (!confirm('ぜんぶの よていと しゃしんを けしますか？（もとに もどせません）')) return; await DB.clear(); store = normalize(null); persist(); refresh(); renderHome(); } }, '🗑 ぜんぶ けす')));
    add(h('h3', null, '🖨️ プリント（A4）'),
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn primary', onclick: () => { closeSettings(); PrintUI.open(); } }, '🖨️ プリントの 画面を ひらく')),
      h('p', { class: 'note' }, 'よていひょう（しゃしんつき）・きりとり カード・まず→つぎ ボードを いんさつ できます。みほんと おなじ ものが いんさつ されます。'));
    add(h('h3', null, '💡 つかいかたの ヒント'),
      h('p', { class: 'note' }, '・「いつ おわる？」は のこりの りょう（えん・バー・ブロック）と いろで、「つぎは なに？」は いつも みぎに みせます。', h('br'),
        '・「あと 1かい」は 🔁 かいすうを いれると ○ を タッチで けして いけます。のこり 1かいで「あと 1かい！」と おおきく でます。', h('br'),
        '・つぎが きゅうけい・おたのしみの ときは「おわったら きゅうけい！」と でます（カードの しゅるいで きめます）。', h('br'),
        '・よていが かわる ときは、ちょくぜんでも「まえ → あと」で しらせると おちついて きりかえ やすく なります。かわった カードには「かわった」の しるしが つきます。'));
    add(h('div', { class: 'btns', style: 'margin-top:20px' }, h('button', { type: 'button', class: 'btn ok', onclick: closeSettings }, '✓ とじる')));
    add(h('div', { class: 'mieel-foot' }, h('div', { class: 'mieel-brand' }, h('span', { class: 'orb-mini' }), h('strong', null, 'MieeL')),
      h('a', { href: 'https://www.mieel-support-school.com/', target: '_blank', rel: 'noopener' }, 'www.mieel-support-school.com'),
      h('div', null, '© みとおし ボード（特別支援教育向け）・学校や家庭での利用は自由です（無断転載・再配布・販売はお断り）')));
  }
  async function exportData() {
    const media = [];
    for (const m of await DB.all()) media.push({ id: m.id, at: m.at, data: await blobToData(m.blob) });
    const blob = new Blob([JSON.stringify({ app: 'mitoshi-board', v: 1, store, media })], { type: 'application/json' });
    const d = new Date(), name = 'みとおしボード_' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.json';
    const a = h('a', { href: URL.createObjectURL(blob), download: name }); document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('ファイルに かきだしました（' + media.length + 'まいの しゃしん）');
  }
  async function importData() {
    const fs = await pickFile('application/json,.json'); if (!fs) return;
    try {
      const j = JSON.parse(await fs[0].text());
      if (j.app !== 'mitoshi-board') throw new Error('x');
      if (!confirm('いまの データを、この ファイルの なかみに おきかえますか？')) return;
      await DB.clear();
      for (const m of j.media || []) { const r = await fetch(m.data); await DB.put({ id: m.id, at: m.at || Date.now(), blob: await r.blob() }); }
      store = normalize(j.store); persist(); Object.keys(URLS).forEach(k => delete URLS[k]);
      toast('よみこみました'); refresh(); renderHome();
    } catch (e) { toast('この ファイルは よみこめません'); }
  }

  (function () {
    const g = $('#gear'); let t = 0;
    g.addEventListener('pointerdown', e => { e.preventDefault(); g.classList.add('pressing'); t = setTimeout(() => { g.classList.remove('pressing'); openSettings(); }, 1500); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => g.addEventListener(ev, () => { clearTimeout(t); g.classList.remove('pressing'); }));
    g.addEventListener('contextmenu', e => e.preventDefault());
  })();
  // 🏠 こどもの がめんでは ながおし（うっかり もどらない）、ほかは タップ
  (function () {
    const b = $('#homeBtn'); let t = 0;
    b.addEventListener('pointerdown', e => { e.preventDefault(); if (CHILD.indexOf(screen) < 0) return; b.classList.add('pressing'); t = setTimeout(() => { b.classList.remove('pressing'); renderHome(); }, 1200); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { clearTimeout(t); b.classList.remove('pressing'); }));
    b.addEventListener('click', () => { if (CHILD.indexOf(screen) < 0 && tapOk()) { sfx.tap(); renderHome(); } });
  })();
  $('#settings').addEventListener('click', e => { if (e.target.id === 'settings') closeSettings(); });
  $('#whoChip').addEventListener('click', () => { if (CHILD.indexOf(screen) < 0) renderWho(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopSpeak(); else if (screen === 'now' && !document.querySelector('.ov')) renderNow(); });

  if (/[?&]test=1/.test(location.search)) window.__mt = { store: () => store, T, renderNow, finishItem, diff, savePhoto };
  document.body.classList.toggle('calm', !!S().calm);
  if (canSpeak) { loadVoice(); if ('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = loadVoice; }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !EMBED) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (store.kids.length > 1 && !EMBED) renderWho(); else renderHome();
  cleanMedia();
})();
</script>
</body>
</html>
